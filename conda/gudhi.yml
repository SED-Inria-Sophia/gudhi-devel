name: gudhi

channels:
  - conda-forge

dependencies:
  - python=3.12
  - cmake
  - boost
  - nanobind
  - numpy
  - cgal-cpp
  - qt = 5.*.*
  - matplotlib
  - scipy
  - scikit-learn
  - sphinx
  - sphinxcontrib-bibtex
  - sphinx-autodoc-typehints
  - pip
  - pip:
      - pydata_sphinx_theme
      - POT
      - sphinx-paramlinks
